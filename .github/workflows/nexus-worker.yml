name: Nexus Engine Worker

on:
  schedule:
    - cron: '*/15 * * * *' # Roda a cada 15 minutos
    - cron: '0 3 1 * *' # Limpeza mensal
  workflow_dispatch:
    inputs:
      campaign_ids:
        description: 'IDs de campanhas para captura direcionada (separados por virgula)'
        required: false
        type: string
  repository_dispatch: # Permite gatilhos externos via API
    types: [nexus-trigger]

concurrency:
  group: nexus-worker-main
  cancel-in-progress: false

jobs:
  nexus-capture:
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 3 1 * *'
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps --only-shell chromium

      - name: Create .env file
        env:
          ADSNAP_CLOUD_KEYS: ${{ secrets.ADSNAP_CLOUD_KEYS }}
          NEXUS_CAPTURE_STORAGE_PROVIDER: ${{ secrets.NEXUS_CAPTURE_STORAGE_PROVIDER }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s\n' "$ADSNAP_CLOUD_KEYS" > .env
          {
            echo ""
            printf '%s=%s\n' 'NEXUS_CAPTURE_STORAGE_PROVIDER' "$NEXUS_CAPTURE_STORAGE_PROVIDER"
            printf '%s=%s\n' 'GOOGLE_DRIVE_ROOT_FOLDER_ID' "$GOOGLE_DRIVE_ROOT_FOLDER_ID"
            printf '%s=%s\n' 'GOOGLE_DRIVE_CLIENT_ID' "$GOOGLE_DRIVE_CLIENT_ID"
            printf '%s=%s\n' 'GOOGLE_DRIVE_CLIENT_SECRET' "$GOOGLE_DRIVE_CLIENT_SECRET"
            printf '%s=%s\n' 'GOOGLE_DRIVE_REFRESH_TOKEN' "$GOOGLE_DRIVE_REFRESH_TOKEN"
            printf '%s=%s\n' 'GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON' "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON"
          } >> .env
          cp .env .env.local
          echo "✅ .env and .env.local created from ADSNAP_CLOUD_KEYS"
          echo "Keys found:"
          grep -oE '^[A-Z_]+' .env || true

      - name: Check Database Connection
        run: npx tsx src/scripts/check-db.ts
        env:
          GITHUB_ACTIONS: "true"

      - name: Run Nexus Worker
        run: npm run worker
        env:
          GITHUB_ACTIONS: "true"
          TARGET_CAMPAIGN_IDS: ${{ inputs.campaign_ids || github.event.client_payload.campaign_ids || '' }}
          NEXUS_WORKER_MAX_RUNTIME_MS: '900000'

      - name: Run Storage Monitor
        run: npm run monitor

  monthly-cleanup:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 1 * *'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        env:
          ADSNAP_CLOUD_KEYS: ${{ secrets.ADSNAP_CLOUD_KEYS }}
        run: printf '%s\n' "$ADSNAP_CLOUD_KEYS" > .env

      - name: Run Monthly Cleanup
        run: npm run monthly-cleanup
