name: Nexus Engine Worker

on:
  schedule:
    - cron: '*/15 * * * *' # Roda a cada 15 minutos
    - cron: '0 3 1 * *' # Limpeza mensal
  workflow_dispatch:
    inputs:
      campaign_ids:
        description: 'IDs de campanhas para captura direcionada (separados por virgula)'
        required: false
        type: string
  repository_dispatch: # Permite gatilhos externos via API
    types: [nexus-trigger]

concurrency:
  group: nexus-worker-main
  cancel-in-progress: false

jobs:
  nexus-capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env file
        run: |
          echo "${{ secrets.ADSNAP_CLOUD_KEYS }}" > .env
          {
            echo ""
            echo "NEXUS_CAPTURE_STORAGE_PROVIDER=${{ secrets.NEXUS_CAPTURE_STORAGE_PROVIDER }}"
            echo "GOOGLE_DRIVE_ROOT_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}"
            echo "GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}"
          } >> .env
          cp .env .env.local
          echo "✅ .env and .env.local created from ADSNAP_CLOUD_KEYS"
          echo "Keys found:"
          grep -oE '^[A-Z_]+' .env || true

      - name: Check Database Connection
        run: npx tsx src/scripts/check-db.ts
        env:
          GITHUB_ACTIONS: "true"

      - name: Run Nexus Worker
        run: npm run worker
        env:
          GITHUB_ACTIONS: "true"
          TARGET_CAMPAIGN_IDS: ${{ github.event.inputs.campaign_ids || '' }}

      - name: Run Storage Monitor
        run: npm run monitor

  monthly-cleanup:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 1 * *'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: echo "${{ secrets.ADSNAP_CLOUD_KEYS }}" > .env

      - name: Run Monthly Cleanup
        run: npm run monthly-cleanup
