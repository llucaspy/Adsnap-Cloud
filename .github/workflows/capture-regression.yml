name: Capture regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: adsnap_test
          POSTGRES_PASSWORD: adsnap_test
          POSTGRES_DB: adsnap_worker_test
          TZ: America/Sao_Paulo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adsnap_test -d adsnap_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://adsnap_test:adsnap_test@127.0.0.1:5432/adsnap_worker_test
      DIRECT_URL: postgresql://adsnap_test:adsnap_test@127.0.0.1:5432/adsnap_worker_test
      AUTH_SECRET: fixture-ci-signing-key-not-a-production-credential
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node test-support/prepare-postgres.mjs
      - run: npm test
      - run: node tests/worker-postgres.integration.cjs "$DATABASE_URL"
      - run: npm run typecheck:worker
      - run: npm run build
      - run: node test-support/seed-worker-ui.mjs
      - name: Verify worker pages with synthetic fixtures
        run: |
          npm run start -- -H 127.0.0.1 -p 4328 > .test-infra/ui-server.log 2>&1 &
          adsnapUiPid=$!
          trap 'kill "$adsnapUiPid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4328/login > /dev/null; then break; fi
            sleep 1
          done
          node test-support/worker-ui-smoke.mjs
