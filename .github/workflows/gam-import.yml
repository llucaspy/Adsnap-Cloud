name: GAM Import Worker
run-name: GAM Import ${{ inputs.job_id || github.event.client_payload.job_id || 'queue' }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Nexus GAM job id
        required: false
        type: string
  repository_dispatch:
    types: [gam-import-trigger]

concurrency:
  group: gam-import-${{ inputs.job_id || github.event.client_payload.job_id || 'queue' }}
  cancel-in-progress: false

jobs:
  gam-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create environment file
        run: |
          echo "${{ secrets.ADSNAP_CLOUD_KEYS }}" > .env
          cp .env .env.local

      - name: Process GAM imports
        run: npx tsx src/scripts/gam-worker.ts
        env:
          GITHUB_ACTIONS: "true"
          GAM_JOB_ID: ${{ inputs.job_id || github.event.client_payload.job_id }}
