name: GAM Import Worker
run-name: GAM Import ${{ inputs.job_id || github.event.client_payload.job_id || 'queue' }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Nexus GAM job id
        required: false
        type: string
  repository_dispatch:
    types: [gam-import-trigger]

concurrency:
  group: gam-import-${{ inputs.job_id || github.event.client_payload.job_id || 'queue' }}
  cancel-in-progress: false

jobs:
  gam-import:
    runs-on: ubuntu-24.04 # Compatible with the pinned Playwright browser/dependency build.
    timeout-minutes: 30
    container:
      # Playwright 1.58.1 and its browser dependencies are preinstalled.
      image: mcr.microsoft.com/playwright:v1.58.1-noble@sha256:56c7596ddb170280f4dd811226777ad0eaec1df8869cc1f90cbdd399d2dc3491
      options: --ipc=host

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create environment file
        env:
          ADSNAP_CLOUD_KEYS: ${{ secrets.ADSNAP_CLOUD_KEYS }}
        run: |
          printf '%s\n' "$ADSNAP_CLOUD_KEYS" > .env
          cp .env .env.local

      - name: Process GAM imports
        run: npx tsx src/scripts/gam-worker.ts
        env:
          GITHUB_ACTIONS: "true"
          GAM_JOB_ID: ${{ inputs.job_id || github.event.client_payload.job_id }}

  report-failure:
    needs: gam-import
    if: ${{ always() && (needs.gam-import.result == 'failure' || needs.gam-import.result == 'cancelled') && (inputs.job_id || github.event.client_payload.job_id) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Record interrupted import
        env:
          ADSNAP_CLOUD_KEYS: ${{ secrets.ADSNAP_CLOUD_KEYS }}
          GAM_JOB_ID: ${{ inputs.job_id || github.event.client_payload.job_id }}
        run: |
          printf '%s\n' "$ADSNAP_CLOUD_KEYS" > .env
          cp .env .env.local
          npx tsx src/scripts/gam-worker.ts --record-workflow-failure
